name: Build Generals Zero Hour iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen p7zip glslang

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git "$HOME/vcpkg"
          "$HOME/vcpkg/bootstrap-vcpkg.sh"
          echo "VCPKG_ROOT=$HOME/vcpkg" >> "$GITHUB_ENV"

      - name: Fetch MoltenVK
        run: |
          chmod +x scripts/build/ios/*.sh
          ./scripts/build/ios/fetch-moltenvk.sh

      - name: Stage fonts
        run: |
          ./scripts/build/ios/stage-fonts.sh

      - name: Configure
        run: |
          cmake --preset ios-vulkan

      - name: Build Generals
        run: |
          cmake \
            --build build/ios-vulkan \
            --target z_generals \
            --parallel 3

      - name: Check build
        run: |
          echo "Searching for GeneralsXZH..."
          find build/ios-vulkan \
            -name "GeneralsXZH" \
            -type f \
            -print

      - name: Prepare unsigned IPA
        run: |
          set -e

          APP=$(find build/ios-vulkan \
            -name "*.app" \
            -type d \
            | head -n 1)

          if [ -z "$APP" ]; then
            echo "ERROR: No .app found"
            exit 1
          fi

          echo "Found app:"
          echo "$APP"

          rm -rf Payload
          mkdir -p Payload

          cp -R "$APP" Payload/GeneralsXZH.app

          echo "Creating IPA..."

          zip -r -y Generals_Zero_Hour.ipa Payload

          echo "IPA created:"
          ls -lh Generals_Zero_Hour.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Generals-Zero-Hour-IPA
          path: Generals_Zero_Hour.ipa
          if-no-files-found: error
          retention-days: 7
