name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen p7zip

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Fetch MoltenVK and Stage Fonts
        run: |
          chmod +x scripts/build/ios/*.sh
          bash ./scripts/build/ios/fetch-moltenvk.sh
          bash ./scripts/build/ios/stage-fonts.sh
          # نسخ مكتبة MoltenVK إلى مجلد العمل المحلي داخل المشروع
          mkdir -p lib
          find $HOME/GeneralsX -name "MoltenVK.xcframework" -exec cp -r {} lib/ \; 2>/dev/null || find . -name "MoltenVK.xcframework" -exec cp -r {} lib/ \; 2>/dev/null || true
          echo "MOLTENVK_DIR=${GITHUB_WORKSPACE}" >> $GITHUB_ENV

      - name: Download Game Assets
        run: |
          curl -L -o assets.7z "https://github.com/AboN3mee/Generals-Mac-iOS-iPad/releases/download/v1.0/Command.Conquer.Generals.Zero.Hour.7z"
          mkdir -p game_assets
          7z x assets.7z -ogame_assets

      - name: Configure and Build
        run: |
          cmake --preset ios-vulkan -DMOLTENVK_DIR="${GITHUB_WORKSPACE}"
          cmake --build build/ios-vulkan --target z_generals

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -r build/ios-vulkan/GeneralsZH.app Payload/ || cp -r build/ios-vulkan/Release-iphoneos/GeneralsZH.app Payload/ || true
          cp -r game_assets/* Payload/GeneralsZH.app/ || true
          zip -r Generals_Zero_Hour.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generals_Zero_Hour_IPA
          path: Generals_Zero_Hour.ipa
