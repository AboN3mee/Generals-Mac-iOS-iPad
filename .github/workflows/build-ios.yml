name: Build iOS IPA

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Select Xcode Version
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Install dependencies
        run: |
          brew install cmake ninja meson pkgconf xcodegen p7zip glslang

      - name: Setup vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git $HOME/vcpkg
          $HOME/vcpkg/bootstrap-vcpkg.sh
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV

      - name: Fetch MoltenVK and Stage Fonts
        run: |
          chmod +x scripts/build/ios/*.sh
          bash ./scripts/build/ios/fetch-moltenvk.sh
          bash ./scripts/build/ios/stage-fonts.sh

          mkdir -p $HOME/vulkan_sdk/lib
          MOLTEN_PATH=$(find $HOME . -name "MoltenVK.xcframework" -type d 2>/dev/null | head -n 1)
          if [ -n "$MOLTEN_PATH" ]; then
            cp -r "$MOLTEN_PATH" $HOME/vulkan_sdk/lib/
          fi

          ARM_DIR="$HOME/vulkan_sdk/lib/MoltenVK.xcframework/ios-arm64"
          mkdir -p "$ARM_DIR"
          find "$ARM_DIR" -name "MoltenVK*" -exec cp {} "$ARM_DIR/libMoltenVK.a" \; 2>/dev/null || true

          echo "VULKAN_SDK=$HOME/vulkan_sdk" >> $GITHUB_ENV

      - name: Download Game Assets
        run: |
          curl -L -o assets.7z "https://github.com/AboN3mee/Generals-Mac-iOS-iPad/releases/download/v1.0/Command.Conquer.Generals.Zero.Hour.7z"
          mkdir -p game_assets
          7z x assets.7z -ogame_assets

      - name: Configure and Build
        run: |
          cmake --preset ios-vulkan
          cmake --build build/ios-vulkan --target z_generals

      - name: Package IPA
        run: |
          mkdir -p Payload
          
          # البحث الديناميكي عن مجلد الـ .app الناتج من البناء
          BUILT_APP=$(find build/ios-vulkan -name "*.app" -type d | head -n 1)
          
          if [ -z "$BUILT_APP" ]; then
            echo "Error: No .app bundle found!"
            exit 1
          fi
          
          echo "Found built app at: $BUILT_APP"
          cp -r "$BUILT_APP" Payload/
          
          # نسخ ملفات وأصول اللعبة إلى داخل حزمة التطبيق
          TARGET_APP=$(find Payload -name "*.app" -type d | head -n 1)
          if [ -d "game_assets" ]; then
            cp -r game_assets/* "$TARGET_APP/" || true
          fi
          
          zip -r Generals_Zero_Hour.ipa Payload

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Generals_Zero_Hour_IPA
          path: Generals_Zero_Hour.ipa
